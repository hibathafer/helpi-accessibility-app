name: flutter_application_1
description: "HelpI — accessibility and urban mobility companion."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Features
  google_maps_flutter: ^2.10.0
  url_launcher: ^6.3.0

  # Persistence (locale + session)
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # Generates lib/l10n/generated/app_localizations.dart from the ARB files.
  generate: true
