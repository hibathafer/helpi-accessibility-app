<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HelpI — accessibility and urban mobility companion: find verified accessible places, transport and community help, in Arabic and English.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HelpI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HelpI — Accessibility &amp; Urban Mobility Companion</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    function startFlutter() {
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    }

    const mapsConfig = document.createElement('script');
    mapsConfig.src = 'maps_api_key.js';
    mapsConfig.onload = function () {
      const key = window.GOOGLE_MAPS_API_KEY;
      if (!key) {
        startFlutter();
        return;
      }
      const maps = document.createElement('script');
      maps.src = 'https://maps.googleapis.com/maps/api/js?key=' +
        encodeURIComponent(key);
      maps.onload = startFlutter;
      maps.onerror = function () {
        console.error('Google Maps JavaScript API failed to load.');
        startFlutter();
      };
      document.head.appendChild(maps);
    };
    mapsConfig.onerror = startFlutter;
    document.head.appendChild(mapsConfig);
  </script>
</body>
</html>
